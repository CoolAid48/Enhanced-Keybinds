name: Publish Enhanced Keybinds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate uploads without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: publishing
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      PUBLISH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify release tag matches mod version
        if: github.event_name == 'push'
        shell: bash
        run: |
          mod_version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ "$GITHUB_REF_NAME" != "v$mod_version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match version $mod_version (expected v$mod_version)."
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Build Enhanced Keybinds
        run: gradle --no-daemon --no-watch-fs build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v7
        with:
          name: enhancedkeybinds-${{ github.run_id }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Modrinth and CurseForge
        run: gradle --no-daemon --no-watch-fs publishMods
