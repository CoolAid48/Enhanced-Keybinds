plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
    id 'maven-publish'
}

group = project.maven_group

def modVersion = project.version
def minecraftVersion = project.minecraft_version
def loaderVersion = project.loader_version
def archivesBaseName = project.archives_base_name
def releaseVersion = modVersion.toString().split('\\+', 2)[0]

base {
    archivesName = archivesBaseName
}

repositories {
    maven { url = "https://maven.isxander.dev/releases" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        url = "https://maven.siphalor.de/"
        name = "Siphalor's Maven"
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs "--enable-native-access=ALL-UNNAMED"
    jvmArgs "--sun-misc-unsafe-memory-access=allow"
    systemProperty "joml.nounsafe", "true"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    modImplementation "de.siphalor.amecs.amecs-key-modifiers:${project.amecs_version}"
    modImplementation "maven.modrinth:modmenu:${project.modmenu_version}"

    include "de.siphalor.amecs.amecs-key-modifiers:${project.amecs_version}"
}

processResources {
    inputs.property "version", modVersion
    inputs.property "minecraft_version", minecraftVersion
    inputs.property "loader_version", loaderVersion
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": modVersion,
                "minecraft_version": minecraftVersion,
                "loader_version": loaderVersion
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "LICENSE_${archivesBaseName}" }
    }
    from("CHANGELOG.md")
}

publishMods {
    file = remapJar.archiveFile
    changelog = providers.fileContents(layout.projectDirectory.file("CHANGELOG.md")).asText
    type = STABLE
    displayName = "Enhanced Keybinds v${releaseVersion} for ${minecraftVersion}"
    modLoaders.add("fabric")
    dryRun = providers.environmentVariable("PUBLISH_DRY_RUN")
            .map { it.toBoolean() }
            .orElse(false)

    modrinth {
        projectId = "NP3csV5D"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraftVersion)
        environment = CLIENT_ONLY
        requires("fabric-api", "yacl")
        embeds("amecs")
    }

    curseforge {
        projectId = "1207805"
        projectSlug = "enhancedkeybinds"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraftVersion)
        client = true
        requires("fabric-api", "yacl")
        embeds("amecs")
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = archivesBaseName
            from components.java
        }
    }

}
